<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Links</title>
  <style>
    :root {
      --bg: #332D2D;
      --card-bg: #A3372E;
      --card-hover: #D72212;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .avatar {
      width: 192px;
      height: 192px;
      margin-bottom: 16px;
      display: inline-block;
      object-fit: contain;
      border: 3px solid #ffffff;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .bio {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .link-btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="avatar" src="logo.svg" alt="Unemployment Days Logo" />

    <h1>Unemployment Days</h1>
    <p class="bio">Content Creator</p>

    <div class="links">

      <a class="link-btn" href="https://www.youtube.com/@UnemploymentD" target="_blank" rel="noopener">
        <img class="icon" src="icons/youtube.svg" alt="YouTube" />
        <span>YouTube</span>
      </a>

      <a class="link-btn" href="https://www.twitch.tv/unemploymentdays" target="_blank" rel="noopener">
        <img class="icon" src="icons/twitch.svg" alt="X / Twitch" />
        <span>Twitch</span>
      </a>

      <a class="link-btn" href="https://tiktok.com/@unemployment.days" target="_blank" rel="noopener">
        <img class="icon" src="icons/tiktok.svg" alt="TikTok" />
        <span>Tiktok</span>
      </a>

      <a class="link-btn" href="https://twitter.com/yourhandle" target="_blank" rel="noopener">
        <img class="icon" src="icons/twitter.svg" alt="X / Twitter" />
        <span>X / Twitter</span>
      </a>

      <a class="link-btn" href="https://instagram.com/yourhandle" target="_blank" rel="noopener">
        <img class="icon" src="icons/instagram.svg" alt="Instagram" />
        <span>Instagram</span>
      </a>

      <a class="link-btn" href="mailto:contact.unemploymentdays@gmail.com">✉️ Contact Me</a>
    </div>
  </div>

</body>
</html>
