<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Links</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #38bdf8;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .bio {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: block;
      background-color: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .link-btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Replace this URL with your profile image URL or upload one to your repo -->
    <img class="avatar" src="logo.svg" alt="Profile Picture" />
    
    <h1>@yourhandle</h1>
    <p class="bio">Content Creator</p>

    <div class="links">
      <a class="link-btn" href="https://github.com/unemploymentdays" target="_blank" rel="noopener">💻 GitHub</a>
      <a class="link-btn" href="https://twitter.com/yourhandle" target="_blank" rel="noopener">🐦 X / Twitter</a>
      <a class="link-btn" href="https://instagram.com/yourhandle" target="_blank" rel="noopener">📸 Instagram</a>
      <a class="link-btn" href="https://youtube.com/@yourhandle" target="_blank" rel="noopener">🎥 YouTube</a>
      <a class="link-btn" href="mailto:contact.unemploymentdays@gmail.com">✉️ Contact Me</a>
    </div>
  </div>

</body>
</html>
